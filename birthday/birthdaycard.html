<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday | BimaHeadquarter</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background-color: #0b1120;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px 16px 40px;
            color: #f8fafc;
        }

        /* Top Action Bar & Dynamic Lead Input */
        .controls-bar {
            width: 100%;
            max-width: 640px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .name-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 260px;
        }

        .name-input-group label {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            white-space: nowrap;
        }

        .name-input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #475569;
            color: #f8fafc;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
        }

        .name-input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.25);
        }

        .actions-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #334155;
            color: #f1f5f9;
            border: 1px solid #475569;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            user-select: none;
        }

        .btn:hover {
            background: #475569;
            color: #ffffff;
        }

        .btn-primary {
            background: #b45309;
            border-color: #d97706;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #92400e;
            border-color: #f59e0b;
        }

        /* Fixed 1086 x 1448 Canvas Architecture */
        .card-viewport-wrapper {
            width: 100%;
            max-width: 640px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .card-scaler {
            width: 100%;
            aspect-ratio: 1086 / 1448;
            position: relative;
        }

        .card {
            width: 1086px;
            height: 1448px;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            background-image: url('card_template.png');
            background-size: 1086px 1448px;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.1);
            user-select: none;
        }

        /* Real Brand Logo (Top Center) */
        .card-brand-logo {
            position: absolute;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            width: 310px;
            height: auto;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.08));
        }

        /* Dynamic Curved Name Layer directly over Ribbon */
        .ribbon-text-container {
            position: absolute;
            top: 550px;
            left: 0;
            width: 1086px;
            height: 200px;
            pointer-events: none;
            z-index: 10;
        }

        .ribbon-text-svg {
            width: 1086px;
            height: 200px;
            display: block;
            overflow: visible;
        }

        .ribbon-svg-text {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 54px;
            font-weight: 600;
            fill: #F4DA8C;
            letter-spacing: 1.2px;
            dominant-baseline: central;
        }

        /* Print Settings */
        @media print {
            body {
                background: #ffffff;
                padding: 0;
            }

            .controls-bar {
                display: none !important;
            }

            .card-viewport-wrapper {
                max-width: 100%;
            }

            .card-scaler {
                width: 1086px;
                height: 1448px;
                aspect-ratio: auto;
            }

            .card {
                transform: none !important;
                box-shadow: none;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Controls Bar -->
    <div class="controls-bar">
        <div class="name-input-group">
            <label for="nameInput">Lead Name:</label>
            <input type="text" id="nameInput" class="name-input" placeholder="Type lead name..." value="Abhishek Verma">
        </div>
        <div class="actions-group">
            <button class="btn" onclick="copyShareLink()" title="Copy dynamic shareable link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                Copy Link
            </button>
            <button class="btn" onclick="downloadCustomImage()" title="Download as high-resolution PNG image">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download Image
            </button>
            <button class="btn btn-primary" onclick="window.print()" title="Print card or save as PDF">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 6 2 18 2 18 9"></polyline>
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                    <rect x="6" y="14" width="12" height="8"></rect>
                </svg>
                Print Card
            </button>
        </div>
    </div>

    <!-- Fixed 1086 x 1448 Canvas Layout -->
    <div class="card-viewport-wrapper">
        <div class="card-scaler">
            <div class="card" id="birthdayCard">
                <!-- Real Brand Logo at Top Center -->
                <img src="brand_logo.png" alt="BimaHeadquarter" class="card-brand-logo">

                <!-- Curved Dynamic SVG Text on Ribbon -->
                <div class="ribbon-text-container">
                    <svg class="ribbon-text-svg" viewBox="0 0 1086 200">
                        <defs>
                            <path id="ribbonTextPath" d="M 242,112 Q 555,73 868,112" />
                            <filter id="textDropShadow" x="-10%" y="-10%" width="130%" height="130%">
                                <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.85" />
                            </filter>
                        </defs>
                        <text class="ribbon-svg-text" filter="url(#textDropShadow)">
                            <textPath id="ribbonTextPathRef" href="#ribbonTextPath" startOffset="50%" text-anchor="middle">
                                Abhishek Verma
                            </textPath>
                        </text>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- Dynamic Query Parameter, Live Curved Text Sync & Canvas Export Script -->
    <script>
        const nameInput = document.getElementById('nameInput');
        const ribbonTextPathRef = document.getElementById('ribbonTextPathRef');
        const svgText = document.querySelector('.ribbon-svg-text');
        const scaler = document.querySelector('.card-scaler');
        const card = document.querySelector('.card');

        // Proportional canvas scaling to fit viewport perfectly while keeping 1086x1448 design coordinates
        function scaleCard() {
            if (!scaler || !card) return;
            const availableWidth = scaler.clientWidth;
            const scale = availableWidth / 1086;
            card.style.transform = `scale(${scale})`;
        }

        // Adjust font size dynamically if name is long
        function updateName(text) {
            const val = text.trim() || "Recipient Name";
            if (ribbonTextPathRef) {
                ribbonTextPathRef.textContent = val;
            }
            if (svgText) {
                const len = val.length;
                if (len > 24) {
                    svgText.style.fontSize = '34px';
                } else if (len > 18) {
                    svgText.style.fontSize = '42px';
                } else {
                    svgText.style.fontSize = '54px';
                }
            }
            document.title = "Happy Birthday " + val + " | BimaHeadquarter";
        }

        // Read dynamic name from URL query parameter (e.g. ?name=John+Doe or ?lead=...)
        function initFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const nameParam = params.get('name') || params.get('lead') || params.get('leadName') || params.get('customerName') || params.get('client');

            if (nameParam && nameParam.trim()) {
                const formatted = nameParam.trim();
                nameInput.value = formatted;
                updateName(formatted);
            } else {
                updateName(nameInput.value);
            }
            scaleCard();
        }

        // Sync from input field
        nameInput.addEventListener('input', function (e) {
            updateName(e.target.value);
        });

        // Copy Shareable Dynamic URL Link
        function copyShareLink() {
            const currentUrl = new URL(window.location.href);
            currentUrl.searchParams.set('name', nameInput.value.trim());

            navigator.clipboard.writeText(currentUrl.toString()).then(() => {
                alert("Link copied!\n" + currentUrl.toString());
            }).catch(() => {
                prompt("Copy this URL:", currentUrl.toString());
            });
        }

        // High-Resolution 1086x1448 Canvas Export Download with Curved Text
        function downloadCustomImage() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = "card_template.png";

            img.onload = function () {
                canvas.width = 1086;
                canvas.height = 1448;

                // Draw pristine base template
                ctx.drawImage(img, 0, 0, 1086, 1448);

                // Draw Real Brand Logo at Top Center
                const logoImg = new Image();
                logoImg.crossOrigin = "anonymous";
                logoImg.src = "brand_logo.png";
                logoImg.onload = function () {
                    const logoW = 310;
                    const logoH = 310 * (logoImg.naturalHeight / logoImg.naturalWidth);
                    const logoX = 543 - (logoW / 2);
                    const logoY = 28;
                    ctx.drawImage(logoImg, logoX, logoY, logoW, logoH);

                    // Configure font for name on ribbon
                    const currentName = nameInput.value.trim() || "Recipient Name";
                    let fontSize = 54;
                    if (currentName.length > 24) fontSize = 34;
                    else if (currentName.length > 18) fontSize = 42;

                    ctx.font = `600 ${fontSize}px "Playfair Display", Georgia, serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#F4DA8C';
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
                    ctx.shadowBlur = 5;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 2.5;

                    // Calculate curved character positions along quadratic arch
                    const charWidths = [];
                    let totalW = 0;
                    const letterSpacing = 1.2;
                    for (let i = 0; i < currentName.length; i++) {
                        const w = ctx.measureText(currentName[i]).width + letterSpacing;
                        charWidths.push(w);
                        totalW += w;
                    }

                    let currX = 555 - (totalW / 2);
                    const curvature = 0.00038;
                    const apexY = 623;

                    for (let i = 0; i < currentName.length; i++) {
                        const w = charWidths[i];
                        const cx = currX + (w / 2);
                        const dx = cx - 555;
                        const cy = apexY + (curvature * dx * dx);
                        const angle = 2 * curvature * dx;

                        ctx.save();
                        ctx.translate(cx, cy);
                        ctx.rotate(angle);
                        ctx.fillText(currentName[i], 0, 0);
                        ctx.restore();

                        currX += w;
                    }

                    // Trigger PNG download
                    const link = document.createElement('a');
                    link.download = `Birthday_Wish_${currentName.replace(/\s+/g, '_')}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                };
            };
        }

        // Resize listeners
        window.addEventListener('resize', scaleCard);
        window.addEventListener('load', initFromUrl);
        initFromUrl();
    </script>

</body>

</html>
